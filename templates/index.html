<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SentimentIQ – AI Review Intelligence</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<style>

.badge-positive { background: #28a745 !important; color: white; }
.badge-negative { background: #dc3545 !important; color: white; }
.badge-neutral { background: #6c757d !important; color: white; }
.badge-sarcasm { background: #ffc107 !important; color: black; }
.badge-churn { background: #dc3545 !important; color: white; }
.badge-inquiry { background: #007bff !important; color: white; }
.rating-star { font-size: 0.8em; }

body{
  font-family:Inter,sans-serif;
  background:#f8fafc;
}
.sidebar{
  position:fixed;
  left:0;top:0;bottom:0;
  width:250px;
  background:#fff;
  border-right:1px solid #e5e7eb;
  padding:20px;
}
.logo{
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:700;
  font-size:22px;
  margin-bottom:30px;
}
.logo-badge{
  width:44px;height:44px;
  border-radius:14px;
  background:linear-gradient(135deg,#2563eb,#60a5fa);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
}
.sidebar-link{
  padding:12px 14px;
  border-radius:12px;
  cursor:pointer;
  color:#475569;
  display:flex;
  align-items:center;
  gap:10px;
}
.sidebar-link.active,
.sidebar-link:hover{
  background:#eef2ff;
  color:#2563eb;
}
.main{
  margin-left:250px;
  padding:30px;
}
.card-ui{
  background:#fff;
  border-radius:16px;
  padding:24px;
  border:1px solid #e5e7eb;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="logo">
    <div class="logo-badge">SI</div>
    Sentiment<span style="color:#2563eb">IQ</span>
  </div>

  <div class="sidebar-link active"
       onclick="showSection('manual-analysis-section', this)">
    <i class="bi bi-pencil"></i> Manual Analysis
  </div>

  <div class="sidebar-link"
       onclick="showSection('bulk-analysis-output', this)">
    <i class="bi bi-bar-chart"></i> Dashboard
  </div>

  <div class="sidebar-link"
       onclick="showReports(this)">
    <i class="bi bi-clock-history"></i> Reports
  </div>
</div>

<!-- MAIN -->
<div class="main">

<!-- MANUAL ANALYSIS -->
<div id="manual-analysis-section">
  <div class="card-ui">
    <h4>Analyze Single Review</h4>
    <textarea id="reviewInput" class="form-control mb-3"
      placeholder="Product quality is amazing but delivery was slow"></textarea>
    <button class="btn btn-primary w-100" onclick="analyzeSingleReview()">
      Analyze Review
    </button>

    <div id="singleReviewOutput" style="display:none" class="mt-4">
      <span id="singleSentiment"></span>
      <span id="singleEmotion"></span>
      <span id="singleIntent"></span>
      <span id="singleAspects"></span>
      <span id="singleSarcasm"></span>
      <span id="singleLanguage"></span>
    </div>
  </div>
</div>

<!-- BULK OUTPUT / DASHBOARD -->
<div id="bulk-analysis-output" style="display:none">
  <div id="resultsContainer" class="d-flex flex-column gap-4">

    <div class="row g-3">
      <div class="col-md-3">
        <div class="card-ui text-center">
          <h2 id="positiveCount">0</h2>
          <small>Positive</small>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card-ui text-center">
          <h2 id="negativeCount">0</h2>
          <small>Negative</small>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card-ui text-center">
          <h2 id="neutralCount">0</h2>
          <small>Neutral</small>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card-ui text-center">
          <h2 id="totalReviews">0</h2>
          <small>Total</small>
        </div>
      </div>
    </div>

    <div class="card-ui">
      <canvas id="sentimentChart"></canvas>
    </div>

    <div class="card-ui">
      <canvas id="aspectMatrixChart"></canvas>
    </div>

    <div class="card-ui">
      <canvas id="timeSeriesChart"></canvas>
    </div>

    <div class="card-ui">
      <ul id="detailedResultsList" class="list-group"></ul>
    </div>

  </div>
</div>

<!-- REPORTS -->
<div id="reports-section" style="display:none">
  <h4 class="fw-bold mb-3">Previous Analyzed Reports</h4>
  <div id="reportsList" class="row g-3"></div>
</div>

</div>

<!-- REQUIRED LIBS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.1/dist/chart.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<!-- 🔴 PASTE YOUR JS CODE BELOW (UNCHANGED) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.1/dist/chart.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script> 
<script>
// --- Global Variables ---
let sentimentChart, aspectMatrixChart, timeSeriesChart;
let allReviewData = []; 
let currentAnalysisData = {};

// --- Core Section Management (FIXED) ---
function showSection(sectionId, element) {
    // Hide all main sections
    const sections = ['manual-analysis-section', 'bulk-analysis-output', 'reports-section'];
    sections.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = 'none';
    });

    // Show requested section
    const targetSection = document.getElementById(sectionId);
    if (targetSection) {
        targetSection.style.display = 'block';
    }

    // Update sidebar active state
    document.querySelectorAll('.sidebar-link').forEach(link => {
        link.classList.remove('active');
    });
    if (element) element.classList.add('active');
}

// --- Reports Section ---
function showReports(element) {
    showSection('reports-section', element);
    loadReportsUI();
}

function loadReportsUI() {
    const list = document.getElementById('reportsList');
    if (!list) return;
    
    list.innerHTML = '';
    const reports = JSON.parse(localStorage.getItem('sentimentReports')) || [];
    
    if (!reports.length) {
        list.innerHTML = '<div class="col-12"><p class="text-muted">No reports yet. Analyze some reviews to save reports.</p></div>';
        return;
    }
    
    reports.forEach(r => {
        list.innerHTML += `
        <div class="col-md-4">
          <div class="card-ui p-3">
            <h6 class="mb-1">${r.product_name || 'CSV Analysis'}</h6>
            <small class="text-muted">${r.date || ''}</small>
          </div>
        </div>`;
    });
}

// --- Manual Analysis (UNCHANGED) ---
function analyzeSingleReview() {
    const reviewText = document.getElementById('reviewInput').value.trim();
    const outputDiv = document.getElementById('singleReviewOutput');
    
    if (!reviewText) {
        alert("Please enter a review to analyze.");
        if (outputDiv) outputDiv.style.display = 'none';
        return;
    }

    const textLower = reviewText.toLowerCase();
    let mockSentiment = 'Neutral', mockEmotion = 'Neutral', mockIntent = 'N/A';
    let mockAspects = {}, mockSarcasm = false, mockLanguage = 'English';

    // Mock analysis logic (same as before)
    if (textLower.includes('superb') || textLower.includes('excellent') || textLower.includes('loved')) {
        mockSentiment = 'Positive'; mockEmotion = 'Joy';
    } else if (textLower.includes('poor') || textLower.includes('bad') || textLower.includes('broke')) {
        mockSentiment = 'Negative'; mockEmotion = 'Anger';
    }

    const sentimentSpan = document.getElementById('singleSentiment');
    const emotionSpan = document.getElementById('singleEmotion');
    const intentSpan = document.getElementById('singleIntent');
    const aspectsSpan = document.getElementById('singleAspects');
    const sarcasmSpan = document.getElementById('singleSarcasm');
    const languageSpan = document.getElementById('singleLanguage');

    if (sentimentSpan) {
        sentimentSpan.textContent = mockSentiment;
        sentimentSpan.className = 'badge ' + getSentimentClass(mockSentiment);
    }
    if (emotionSpan) {
        emotionSpan.textContent = mockEmotion;
        emotionSpan.className = 'badge ' + getSentimentClass(mockEmotion.toLowerCase());
    }
    if (intentSpan) {
        intentSpan.textContent = mockIntent;
        intentSpan.className = 'badge bg-primary';
    }
    if (aspectsSpan) aspectsSpan.innerHTML = formatAspects(mockAspects);
    if (sarcasmSpan) {
        sarcasmSpan.textContent = mockSarcasm ? '⚠️ Sarcasm Detected' : 'No Sarcasm';
        sarcasmSpan.className = 'badge ' + (mockSarcasm ? 'bg-warning' : 'bg-success');
    }
    if (languageSpan) languageSpan.textContent = `Lang: ${mockLanguage}`;
    
    if (outputDiv) outputDiv.style.display = 'block';
    document.getElementById('reviewInput').value = "";
}

// --- Utility Functions (UNCHANGED) ---
function getSentimentClass(sentiment) {
    const classes = {
        'Positive': 'bg-success', 'Negative': 'bg-danger', 'Neutral': 'bg-secondary',
        'joy': 'bg-success', 'anger': 'bg-danger', 'sadness': 'bg-info text-white'
    };
    return classes[sentiment] || 'bg-secondary';
}

function getStarRating(rating) {
    if (!rating) return '';
    const fullStar = '<i class="bi bi-star-fill text-warning"></i>';
    return fullStar.repeat(rating);
}

function formatAspects(aspects) {
    let html = '';
    for (const aspect in aspects) {
        html += `<span class="badge ${getSentimentClass(aspects[aspect])}">${aspect}</span> `;
    }
    return html;
}

// --- Bulk Processing Functions (FIXED Display Logic) ---
function processBulkData(data) {
    currentAnalysisData = data;
    
    // Hide manual, show bulk
    document.getElementById('manual-analysis-section').style.display = 'none';
    document.getElementById('bulk-analysis-output').style.display = 'block';
    
    // Show results container safely
    const resultsContainer = document.getElementById('resultsContainer');
    if (resultsContainer) resultsContainer.style.display = 'flex';

    allReviewData = data.detailed_results || [];

    // Update counters
    const summary = data.summary || { Positive: 0, Negative: 0, Neutral: 0, total: 0 };
    document.getElementById('positiveCount').textContent = summary.Positive || 0;
    document.getElementById('negativeCount').textContent = summary.Negative || 0;
    document.getElementById('neutralCount').textContent = summary.Neutral || 0;
    document.getElementById('totalReviews').textContent = summary.total || 0;

    // Update charts (with error handling)
    if (typeof updateChart === 'function') updateChart(summary);
    if (typeof updateAspectMatrixChart === 'function' && data.drill_down_matrix) {
        updateAspectMatrixChart(data.drill_down_matrix);
    }
    if (typeof populateDetailedList === 'function') {
        populateDetailedList(allReviewData);
    }
}

// --- Session Loading (FIXED) ---
async function loadDataFromSession(sessionId) {
    if (!sessionId) return;
    
    try {
        document.title = "Analysis Results - Loading...";
        const endpoint = `/api/get_session_data/${sessionId}`;
        const response = await fetch(endpoint);
        
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        
        const data = await response.json();
        processBulkData(data);
        document.title = "Analysis Results - SentimentIQ";
        
    } catch (error) {
        console.error("Session load failed:", error);
        alert(`Error loading results: ${error.message}`);
        
        // Fallback to manual analysis
        document.getElementById('manual-analysis-section').style.display = 'block';
        document.getElementById('bulk-analysis-output').style.display = 'none';
        const resultsContainer = document.getElementById('resultsContainer');
        if (resultsContainer) resultsContainer.style.display = 'none';
    }
}

// --- SINGLE INITIALIZATION (No Duplicates) ---
document.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('session_id');
    
    // Default: Manual analysis visible
    document.getElementById('manual-analysis-section').style.display = 'block';
    document.getElementById('bulk-analysis-output').style.display = 'none';
    document.getElementById('reports-section').style.display = 'none';
    
    // Set Manual Analysis as active by default
    const manualLink = document.querySelector(".sidebar-link[onclick*='manual-analysis-section']");
    if (manualLink) manualLink.classList.add('active');
    
    // Handle session ID
    if (sessionId) {
        const bulkLink = document.querySelector(".sidebar-link[onclick*='bulk-analysis-output']");
        if (bulkLink) showSection('bulk-analysis-output', bulkLink);
        loadDataFromSession(sessionId);
    } else {
        const resultsContainer = document.getElementById('resultsContainer');
        if (resultsContainer) resultsContainer.style.display = 'none';
    }
});
</script>


</body>
</html>
